<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 870" fill="none">
  <rect width="800" height="870" fill="#E3D9C6"/>
  <circle cx="620" cy="200" r="150" fill="#D9541E" fill-opacity="0.16"/>
  <rect x="75" y="75" width="650" height="720" fill="#F3EEE3" stroke="#111111" stroke-width="2.5"/>

  <!-- Header -->
  <circle cx="128" cy="132" r="7" fill="#D9541E"/>
  <text x="148" y="138" fill="#111111" font-family="sans-serif" font-size="16" font-weight="800" letter-spacing="3.5">ALUR TRANSAKSI &bull; 01 / 03</text>
  <line x1="120" y1="166" x2="680" y2="166" stroke="#111111" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Step Number -->
  <text x="120" y="250" fill="#D9541E" font-family="Georgia, serif" font-style="italic" font-size="64" font-weight="700">01</text>
  <text x="215" y="232" fill="#111111" font-family="sans-serif" font-size="34" font-weight="800">Mencari Barang</text>
  <text x="215" y="262" fill="#111111" fill-opacity="0.65" font-family="sans-serif" font-size="18" font-weight="600">Pilih kategori &amp; kecamatan terdekatmu</text>

  <!-- Illustration: Catalog Cards + Magnifying Glass -->
  <g transform="translate(120, 305)">
    <rect x="0" y="0" width="380" height="330" fill="#FBF8F2" stroke="#111111" stroke-width="2.5"/>
    <rect x="28" y="28" width="150" height="165" fill="#D9541E" stroke="#111111" stroke-width="2"/>
    <rect x="202" y="28" width="150" height="165" fill="#E5DEC9" stroke="#111111" stroke-width="2"/>
    <line x1="28" y1="220" x2="178" y2="220" stroke="#111111" stroke-width="6"/>
    <line x1="28" y1="242" x2="135" y2="242" stroke="#111111" stroke-opacity="0.5" stroke-width="4"/>
    <line x1="202" y1="220" x2="352" y2="220" stroke="#111111" stroke-width="6"/>
    <line x1="202" y1="242" x2="305" y2="242" stroke="#111111" stroke-opacity="0.5" stroke-width="4"/>
    <rect x="28" y="274" width="120" height="28" rx="14" fill="#111111"/>

    <!-- Magnifier -->
    <circle cx="435" cy="195" r="82" fill="#111111" stroke="#F3EEE3" stroke-width="6"/>
    <circle cx="435" cy="195" r="52" stroke="#D9541E" stroke-width="5"/>
    <line x1="494" y1="254" x2="555" y2="315" stroke="#D9541E" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Progress Indicator -->
  <rect x="120" y="705" width="180" height="8" fill="#D9541E"/>
  <rect x="310" y="705" width="180" height="8" fill="#111111" fill-opacity="0.18"/>
  <rect x="500" y="705" width="180" height="8" fill="#111111" fill-opacity="0.18"/>
</svg>

